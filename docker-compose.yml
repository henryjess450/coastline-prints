# Runs the site. HTTPS comes from the shared Caddy in C:\kindly-sent\edge, which reaches
# this app over the "web" Docker network (one Caddy serves every site on the PC).
#   docker network create web     (once)
#   docker compose up -d --build --remove-orphans
# Your settings and passwords come from .env (never committed).
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Paths inside the container (these override the values in .env).
      DATABASE_URL: file:/app/data/coastline.db
      STORAGE_DIR: /app/storage
      HOST: 0.0.0.0
      PORT: "3100"
      OUTBOX_WORKER: "on"
    volumes:
      - coastline-data:/app/data # database
      - coastline-storage:/app/storage # uploaded STL files
      - ./backups:/app/backups # backups appear in this folder on your PC
      - ./fonts:/app/fonts:ro # optional: arial.ttf + arialbd.ttf for receipts
    ports:
      # Only for checking at http://localhost:3100 on the PC itself.
      - "127.0.0.1:3100:3100"
    networks:
      web:
        aliases: [coastline-app]

volumes:
  coastline-data:
  coastline-storage:

networks:
  web:
    external: true
